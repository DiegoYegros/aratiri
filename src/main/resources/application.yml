server:
  port: ${SERVER_PORT:2100}
  tomcat:
    threads:
      max: ${TOMCAT_THREADS_MAX:100}

spring:
  application:
    name: aratiri
  task:
    scheduling:
      pool:
        size: 4
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres_db:5432/aratiri_db}
    username: ${SPRING_DATASOURCE_USERNAME:aratiri_user}
    password: ${SPRING_DATASOURCE_PASSWORD:aratiri_password}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
    hikari:
      maximum-pool-size: ${HIKARI_MAXIMUM_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MINIMUM_IDLE:2}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:600000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:1800000}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:30000}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
  jpa:
    properties:
      hibernate:
        default_schema: ${SPRING_JPA_DEFAULT_SCHEMA:aratiri}
    hibernate:
      ddl-auto: ${SPRING_JPA_DDL_AUTO:validate}
    show-sql: false
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
  mail:
    host: ${ARATIRI_MAIL_HOST:smtp.gmail.com}
    port: ${ARATIRI_MAIL_PORT:587}
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: invoice-listener-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      ack-mode: manual_immediate
  flyway:
    enabled: true
    baseline-on-migrate: true
    schemas: ${SPRING_FLYWAY_SCHEMAS:aratiri}
    default-schema: ${SPRING_FLYWAY_DEFAULT_SCHEMA:aratiri}
springdoc:
  api-docs:
    enabled: ${aratiri.security.api-docs.enabled:false}
  swagger-ui:
    enabled: ${aratiri.security.api-docs.enabled:false}
grpc:
  client:
    lnd:
      name: ${GRPC_CLIENT_LND_NAME}
      port: ${GRPC_CLIENT_LND_PORT}
  tls:
    active: ${GRPC_TLS_ACTIVE:true}

lnd:
  path:
    tls:
      cert: ${LND_TLS_CERT_PATH:}
    macaroon:
      admin: ${ADMIN_MACAROON_PATH}

aratiri:
  base:
    url: ${ARATIRI_BASE_URL}
  outbox:
    batch-size: ${ARATIRI_OUTBOX_BATCH_SIZE:200}
    fixed-delay-ms: ${ARATIRI_OUTBOX_FIXED_DELAY_MS:1000}
  reconciliation:
    batch-size: ${ARATIRI_RECONCILIATION_BATCH_SIZE:100}
  invoices:
    expiry-seconds: ${ARATIRI_INVOICES_EXPIRY_SECONDS:3600}
  cors:
    allowed:
      origins: ${ARATIRI_CORS_ALLOWED_ORIGINS}
  currency:
    conversion:
      api:
        url: ${ARATIRI_CURRENCY_CONVERSION_API_URL:https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=%s}
      history:
        api:
          url: ${ARATIRI_CURRENCY_CONVERSION_HISTORY_API_URL:https://api.coingecko.com/api/v3/coins/bitcoin/market_chart?vs_currency=%s&days=%s}
      fallback:
        api:
          url: ${ARATIRI_CURRENCY_CONVERSION_FALLBACK_API_URL:https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/%s.json}
      cache:
        current:
          ttl-seconds: ${ARATIRI_CURRENCY_CONVERSION_CACHE_CURRENT_TTL_SECONDS:10}
        history:
          ttl-seconds: ${ARATIRI_CURRENCY_CONVERSION_CACHE_HISTORY_TTL_SECONDS:300}
  accounts:
    fiat:
      currencies: ${ARATIRI_ACCOUNTS_FIAT_CURRENCIES:usd,pyg,ars,eur}
  webhooks:
    delivery:
      fixed-delay-ms: ${ARATIRI_WEBHOOKS_DELIVERY_FIXED_DELAY_MS:5000}
    destination:
      # Unsafe / lab-only. Keep false in production.
      allow-http: ${ARATIRI_WEBHOOKS_DESTINATION_ALLOW_HTTP:false}
      # Unsafe / lab-only. Keep false in production.
      allow-private-networks: ${ARATIRI_WEBHOOKS_DESTINATION_ALLOW_PRIVATE_NETWORKS:false}
      # Optional exact hosts or *.suffix wildcards (see docs/configuration.md). Default empty.
  security:
    default-principal-claim: ${ARATIRI_SECURITY_DEFAULT_PRINCIPAL_CLAIM:email}
    api-docs:
      enabled: ${ARATIRI_SECURITY_API_DOCS_ENABLED:false}
    auth-rate-limit:
      # Per-process only: not shared across instances, resets on restart, uses servlet remoteAddr
      # (not raw X-Forwarded-For). Does not replace gateway/WAF limits, MFA, lockout, or monitoring.
      # window must be in [1ms, 1d]; invalid values fail startup before serving traffic.
      enabled: ${ARATIRI_SECURITY_AUTH_RATE_LIMIT_ENABLED:true}
      requests-per-window: ${ARATIRI_SECURITY_AUTH_RATE_LIMIT_REQUESTS_PER_WINDOW:30}
      window: ${ARATIRI_SECURITY_AUTH_RATE_LIMIT_WINDOW:1m}
      maximum-keys: ${ARATIRI_SECURITY_AUTH_RATE_LIMIT_MAXIMUM_KEYS:100000}
    token-exchange:
      enabled: ${ARATIRI_TOKEN_EXCHANGE_ENABLED:false}
      client-id: ${ARATIRI_TOKEN_EXCHANGE_CLIENT_ID:}
      client-secret: ${ARATIRI_TOKEN_EXCHANGE_CLIENT_SECRET:}
    trusted-issuers:
      - issuer: ${ARATIRI_TRUSTED_ISSUER:http://localhost:8000}
        jwk-set-uri: ${ARATIRI_TRUSTED_ISSUER_JWK_SET_URI:http://localhost:8000/jwks.json}
        principal-claim: ${ARATIRI_TRUSTED_ISSUER_PRINCIPAL_CLAIM:email}
        name-claim: ${ARATIRI_TRUSTED_ISSUER_NAME_CLAIM:name}
        auto-provision-user: ${ARATIRI_TRUSTED_ISSUER_AUTO_PROVISION:true}
        auto-provision-account: ${ARATIRI_TRUSTED_ISSUER_AUTO_ACCOUNT:true}
        audience:
          - aratiri-local
        provider: ${ARATIRI_TRUSTED_ISSUER_PROVIDER:EXTERNAL}
        default-role: ${ARATIRI_TRUSTED_ISSUER_DEFAULT_ROLE:USER}
nostr:
  active: ${NOSTR_ACTIVE:true}
  relay:
    url: ${NOSTR_RELAY_URL:wss://relay.primal.net}
  retry:
    max-retries: ${NOSTR_RETRY_MAX:5}
    initial-delay: ${NOSTR_RETRY_INITIAL_DELAY:2000}
    max-delay: ${NOSTR_RETRY_MAX_DELAY:300000}
  payment:
    default:
      fee:
        limit:
          sat: ${ARATIRI_PAYMENT_DEFAULT_FEE_LIMIT_SAT:50}
      timeout:
        seconds: ${ARATIRI_PAYMENT_DEFAULT_TIMEOUT_SECONDS:200}
    lightning:
      fee:
        fixed:
          sat: ${ARATIRI_PAYMENT_LIGHTNING_FEE_FIXED_SAT:0}
        percent: ${ARATIRI_PAYMENT_LIGHTNING_FEE_PERCENT:0}
    onchain:
      fee:
        fixed:
          sat: ${ARATIRI_PAYMENT_ONCHAIN_FEE_FIXED_SAT:0}
        percent: ${ARATIRI_PAYMENT_ONCHAIN_FEE_PERCENT:0}
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:8400}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:2592000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}

logging:
  level:
    com.aratiri: ${ARATIRI_LOG_LEVEL:INFO}
