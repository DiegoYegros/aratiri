# Scrape Aratiri Spring Boot actuator on the host loopback.
# Prometheus runs with network_mode: host so 127.0.0.1 is the Tailscale host.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: aratiri
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    static_configs:
      - targets:
          - 127.0.0.1:2100
        labels:
          service: aratiri
          env: production
