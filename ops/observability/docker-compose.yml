# Aratiri observability pack — Prometheus + Loki + Grafana (Tailscale-only).
#
# Prometheus scrapes the host loopback actuator (127.0.0.1:2100); Promtail
# discovers the aratiri-backend container via the docker socket and ships its
# json-file logs into Loki (single-binary, filesystem storage). Prometheus,
# Grafana and Loki use network_mode: host so the UI/API listen on the Tailscale
# address only; Promtail listens on loopback (no UI).
#
# Nothing binds 0.0.0.0. UI/API listen on the Tailscale IP or loopback only.
#
# Usage (on the Tailscale host):
#   mkdir -p ~/aratiri-observability && cp -a ops/observability/. ~/aratiri-observability/
#   cp .env.example .env   # set GRAFANA_ADMIN_PASSWORD
#   docker compose --env-file .env up -d
#
# Images are from Docker Hub (no GHCR dependency).
# Memory budget: Prometheus 384m + Grafana 384m + Loki 256m + Promtail 128m.
name: aratiri-observability

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: aratiri-prometheus
    restart: unless-stopped
    network_mode: host
    security_opt:
      - no-new-privileges:true
    user: "65534:65534"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=512MB
      - --web.listen-address=${TAILSCALE_IP:-100.124.162.6}:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    mem_limit: 384m
    cpus: 0.50

  grafana:
    image: grafana/grafana:11.3.1
    container_name: aratiri-grafana
    restart: unless-stopped
    network_mode: host
    security_opt:
      - no-new-privileges:true
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_SERVER_HTTP_ADDR: ${TAILSCALE_IP:-100.124.162.6}
      GF_SERVER_HTTP_PORT: "3002"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    mem_limit: 384m
    cpus: 0.50

  loki:
    image: grafana/loki:3.7.6
    container_name: aratiri-loki
    restart: unless-stopped
    network_mode: host
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    environment:
      TAILSCALE_IP: ${TAILSCALE_IP:-100.124.162.6}
    command:
      - -config.file=/etc/loki/loki.yaml
      - -config.expand-env=true
    volumes:
      - ./loki:/etc/loki:ro
      - loki_data:/loki
    mem_limit: 256m
    cpus: 0.50

  promtail:
    image: grafana/promtail:3.6.11
    container_name: aratiri-promtail
    restart: unless-stopped
    network_mode: host
    security_opt:
      - no-new-privileges:true
    depends_on:
      - loki
    environment:
      TAILSCALE_IP: ${TAILSCALE_IP:-100.124.162.6}
    command:
      - -config.file=/etc/promtail/config.yml
      - -config.expand-env=true
    volumes:
      - ./promtail/promtail.yml:/etc/promtail/config.yml:ro
      # Docker service discovery needs the socket (read-only; the docker
      # stage only ever reads json-file logs).
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_data:/var/lib/promtail
    mem_limit: 128m
    cpus: 0.25

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_data: