# Production deployment of the Aratiri stack from GHCR images.
#
# This is the CONVERTED version of the server's ~/aratiri-deploy/docker-compose.yml:
# identical services, container names, ports, env, healthchecks and memory tuning
# (KAFKA_HEAP_OPTS -Xms256m -Xmx256m, JAVA_TOOL_OPTIONS=-Xmx384m, hikari 10) — only
# the three `build:` sections are replaced by their GHCR image refs.
#
# Public exposure is preserved exactly: :2100/:3000/:3001 bind 0.0.0.0, LND p2p on
# :9735, kafka/db bind 127.0.0.1.
#
# Usage (on the server):
#   docker compose -f docker-compose.prod.yml --env-file .env pull
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
#
# Or automated via ops/deploy/deploy.sh (systemd timer).
name: aratiri
services:
  db:
    image: postgres:16-alpine
    container_name: aratiri-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: aratiri-kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"
      - "127.0.0.1:9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_LISTENERS: 'INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://kafka:9093'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka:29092,EXTERNAL://localhost:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: '-Xms256m -Xmx256m'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  lnd:
    image: lightninglabs/lnd:v0.20.2-beta
    container_name: aratiri-lnd
    restart: unless-stopped
    ports:
      - "9735:9735"
    volumes:
      - ./lnd-data:/root/.lnd
    healthcheck:
      test: [ "CMD-SHELL", "lncli --lnddir=/root/.lnd getinfo >/dev/null 2>&1 || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 60
      start_period: 20s

  aratiri-app:
    image: ghcr.io/diegoyegros/aratiri:latest
    container_name: aratiri-backend
    restart: unless-stopped
    ports:
      - "2100:2100"
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SERVER_PORT=${SERVER_PORT:-2100}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - SPRING_DATASOURCE_DRIVER=${SPRING_DATASOURCE_DRIVER}
      - SPRING_JPA_DATABASE_PLATFORM=${SPRING_JPA_DATABASE_PLATFORM}
      - SPRING_JPA_DDL_AUTO=${SPRING_JPA_DDL_AUTO}
      - ARATIRI_BASE_URL=${ARATIRI_BASE_URL}
      - ARATIRI_CORS_ALLOWED_ORIGINS=${ARATIRI_CORS_ALLOWED_ORIGINS}
      - ARATIRI_PAYMENT_DEFAULT_FEE_LIMIT_SAT=${ARATIRI_PAYMENT_DEFAULT_FEE_LIMIT_SAT:-50}
      - ARATIRI_PAYMENT_DEFAULT_TIMEOUT_SECONDS=${ARATIRI_PAYMENT_DEFAULT_TIMEOUT_SECONDS:-200}
      - ARATIRI_PAYMENT_LIGHTNING_FEE_FIXED_SAT=${ARATIRI_PAYMENT_LIGHTNING_FEE_FIXED_SAT:-0}
      - ARATIRI_PAYMENT_LIGHTNING_FEE_PERCENT=${ARATIRI_PAYMENT_LIGHTNING_FEE_PERCENT:-0}
      - ARATIRI_PAYMENT_ONCHAIN_FEE_FIXED_SAT=${ARATIRI_PAYMENT_ONCHAIN_FEE_FIXED_SAT:-0}
      - ARATIRI_PAYMENT_ONCHAIN_FEE_PERCENT=${ARATIRI_PAYMENT_ONCHAIN_FEE_PERCENT:-0}
      - ARATIRI_ACCOUNTS_FIAT_CURRENCIES=${ARATIRI_ACCOUNTS_FIAT_CURRENCIES:-usd,pyg,ars,eur}
      - GRPC_CLIENT_LND_NAME=${GRPC_CLIENT_LND_NAME}
      - GRPC_CLIENT_LND_PORT=${GRPC_CLIENT_LND_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-8400}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION:-2592000}
      - ARATIRI_MAIL_HOST=${ARATIRI_MAIL_HOST:-smtp.gmail.com}
      - ARATIRI_MAIL_PORT=${ARATIRI_MAIL_PORT:-587}
      - EMAIL_USERNAME=${EMAIL_USERNAME}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - HIKARI_MAXIMUM_POOL_SIZE=${HIKARI_MAXIMUM_POOL_SIZE:-10}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID}
      - ADMIN_MACAROON_PATH=${ADMIN_MACAROON_PATH}
      - LND_TLS_CERT_PATH=${LND_TLS_CERT_PATH}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - NOSTR_ACTIVE=${NOSTR_ACTIVE:-true}
      - JAVA_TOOL_OPTIONS=-Xmx384m
    volumes:
      - ./secrets:/run/secrets:ro
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      lnd:
        condition: service_started

  aratiri-frontend:
    image: ghcr.io/diegoyegros/aratiri-frontend:latest
    container_name: aratiri-frontend
    restart: unless-stopped
    environment:
      - PORT=3000
    ports:
      - "3000:3000"

  aratiri-admin:
    image: ghcr.io/diegoyegros/aratiri-admin:latest
    container_name: aratiri-admin
    restart: unless-stopped
    environment:
      - PORT=3001
    ports:
      - "3001:3001"

volumes:
  kafka_data:
  postgres_data:
