org.gradle.caching=true
org.gradle.parallel=true
org.gradle.java.installations.auto-download=true
lndProtoVersion=v0.18.5-beta

# RAM caps for low-memory build boxes (e.g. the 2 GB server). 1 worker keeps
# concurrent daemon memory bounded; the CI runner (7 GB) is unaffected.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m
org.gradle.workers.max=1

